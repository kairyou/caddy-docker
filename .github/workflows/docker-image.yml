name: Docker Image CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO: kairyou/caddy-docker
  VERSION: '2.11.7'

jobs:
  buildx:
    runs-on: ubuntu-latest
    environment:
      name: secrets
    steps:
      - name: Get current date
        run: echo "BUILD_DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d_%H-%M')" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REPO }}:${{ env.VERSION }}
            ${{ env.REPO }}:latest
            ${{ env.REPO }}:${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record published digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "Image: ${REPO}:${VERSION}"
            echo "Digest: ${REPO}@${IMAGE_DIGEST}"
            echo "Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
